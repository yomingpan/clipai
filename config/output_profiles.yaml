schema_version: 1

profiles:
  - id: plain_text
    instruction: ""
    presentation: plain_text

  - id: english_learning_compact
    presentation: plain_text
    instruction: |
      Put exactly one target English expression first, then give at most two short, conversational Traditional Chinese sentences combining its meaning with a concrete usage situation, followed by one practical English example.
      Add `同義：` with 1-3 useful close alternatives only when genuinely helpful. End with `記憶：` and one concrete, short mnemonic or association.
      Keep the entire answer compact. Do not use Markdown headings or extra sections.

  - id: english_improvement
    presentation: markdown_sections
    required_markers:
      - "## Full Rewrite"
      - "## Key Improvements"
      - "## Useful Patterns"
    instruction: |
      Use exactly these three Markdown sections in order: Full Rewrite, Key Improvements,
      and Useful Patterns. Keep every section concise, visually scannable, and free of repeated corrections.
