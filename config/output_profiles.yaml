schema_version: 1

profiles:
  - id: plain_text
    instruction: ""
    presentation: plain_text

  - id: english_learning_compact
    presentation: markdown_sections
    required_markers:
      - "## Word or Phrase"
      - "## Meaning"
      - "## Context"
      - "## Example"
    instruction: |
      Use exactly these four concise Markdown sections in order: Word or Phrase, Meaning, Context, and Example.
      Add `## Synonym or Similar Expression` only when it provides a useful distinction. Teach one practical expression only.

  - id: english_improvement
    presentation: markdown_sections
    required_markers:
      - "## What Sounds Off"
      - "## Better Ways To Say It"
      - "## Full Rewrite"
      - "## Useful Patterns"
    instruction: |
      Use exactly these four Markdown sections in order: What Sounds Off, Better Ways To Say It,
      Full Rewrite, and Useful Patterns. Keep every section concise and avoid additional sections.
