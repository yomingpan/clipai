schema_version: 1

profiles:
  - id: plain_text
    instruction: ""
    presentation: plain_text

  - id: english_learning_compact
    presentation: plain_text
    instruction: |
      Teach exactly one expression that appears literally in the input. Never substitute, infer, or invent an expression not present in the input.
      Put it first, then give at most two short Traditional Chinese sentences combining meaning and natural usage, followed by one practical English example.
      Add `同義：` with 1-3 useful close alternatives only when genuinely helpful. End with `記憶：` and one concrete, short mnemonic or association.
      Keep the entire answer compact. Do not use Markdown headings or extra sections.

  - id: english_improvement
    presentation: markdown_sections
    required_markers:
      - "## What Sounds Off"
      - "## Better Ways To Say It"
      - "## Full Rewrite"
      - "## Useful Patterns"
    instruction: |
      Use exactly these four Markdown sections in order: What Sounds Off, Better Ways To Say It,
      Full Rewrite, and Useful Patterns. Keep every section concise and avoid additional sections.
