actions:
  - id: translate_zh_tw
    name: 翻譯成中文
    hotkey: ctrl+alt+1
    stream: true
    input_mode: selection
    output_mode: paste
    temperature: 0.1
    system_prompt: >
      你是專業翻譯助理。請忠實翻譯輸入內容為繁體中文，不要補充額外說明，
      不要延伸原意，不要省略重點，保留原本語氣與資訊。
    prompt: |
      請將以下內容翻譯成繁體中文：

      {input}

  - id: translate_en
    name: 翻譯成英文
    hotkey: ctrl+alt+2
    stream: true
    input_mode: selection
    output_mode: paste
    temperature: 0.1
    system_prompt: >
      你是專業翻譯助理。請忠實翻譯輸入內容為自然、流暢的英文，
      不要補充額外說明，不要延伸原意，不要省略重點。
    prompt: |
      Please translate the following content into natural English:

      {input}

  - id: rewrite_complete
    name: 將文字重組
    hotkey: ctrl+alt+3
    stream: true
    input_mode: selection
    output_mode: paste
    temperature: 0.2
    system_prompt: >
      你是文字重組助理。請把鬆散、破碎或不完整的輸入重組成清楚完整的句子。
      不要延伸原意，不要增加新的資訊，不要縮短原意，只做結構整理與語句補全。
    prompt: |
      請將以下內容整理成完整、自然、清楚的表達：

      {input}

  - id: shorten_keep_meaning
    name: 縮短句子
    hotkey: ctrl+alt+4
    stream: true
    input_mode: selection
    output_mode: paste
    temperature: 0.2
    system_prompt: >
      你是精簡助理。請在保留原文約 80% 核心意思的前提下，將文字縮短。
      不要改變結論，不要加入新資訊，輸出要直接可用。
    prompt: |
      請精簡以下內容，保留約 80% 的核心意思：

      {input}

  - id: summarize_next_steps
    name: 總結重點與下一步
    hotkey: ctrl+alt+5
    stream: true
    input_mode: selection
    output_mode: popup
    temperature: 0.2
    system_prompt: >
      你是摘要助理。請將輸入整理為清楚的大綱，列出重點，並提出可執行的下一步。
      請保持內容貼近原文，不要無根據擴寫。
    prompt: |
      請摘要以下內容，並用以下結構輸出：
      1. 大綱
      2. 重點
      3. 下一步

      內容如下：

      {input}

  - id: tts_read_selection
    name: Read Selection
    hotkey: ctrl+alt+q
    input_mode: selection
    output_mode: none
