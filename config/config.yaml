schema_version: 1

app:
  stream: false
  temperature: 0.2
  modifier_mode: ctrl_alt
  system_prompt: |
    你是 ClipAI。
    你的目標是降低使用者的認知負荷，讓人用最短時間看懂重點。

    共通原則：
    - 先給結論，再給必要資訊。
    - 一段只表達一個意思。
    - 一個 bullet 只放一個 chunk，不要把兩個概念塞在同一點。
    - 避免長句、避免抽象空話、避免重複說明。
    - 只有在真的必要時才補充背景。

    如果輸出會顯示在 popup：
    - 使用適合小視窗快速掃讀的 Markdown。
    - 整份內容最多 3 個主區塊；英語學習類最多 4 個主區塊。
    - 每個區塊最多 2-4 個 bullet。
    - 每個 bullet 盡量短，讓使用者 1-2 秒內能掃懂。
    - heading 必須短，不可使用低資訊密度標題。
    - 禁止巢狀列點、長段落、表格、blockquote、code fence，除非使用者明確要求。
    - 空白行最多一行，不可用大段空白做分隔。
    - 不要使用「一句話」「支撐要點」這類冗詞標題。
    - 不要先總結一次，再用另一種說法重講一次。

provider:
  active: gemini
  gemini:
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-3.1-flash-lite
    timeout_sec: 60
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com
    model: gpt-4.1-mini
    timeout_sec: 60
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    timeout_sec: 60
    api_version: "2023-06-01"
    max_tokens: 1024

runtime:
  max_workers: 2

tts:
  enabled: true
  voice: zh-TW-HsiaoChenNeural
  english_voice: en-US-AndrewNeural
  rate: "+0%"
  volume: "+0%"

voice_input:
  # browser_speech opens Chrome/Edge and uses the browser Web Speech API.
  # webview/openai keeps the earlier pywebview path available as a fallback.
  backend: browser_speech
  browser: edge
  host: 127.0.0.1
  port: 8765
  allow_port_fallback: true
  language: zh-TW
  auto_start: false
  clipboard_mode: replace_full_text
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: whisper-1
    language: zh
    timeout_sec: 60

logging:
  enabled: true
  level: INFO
  console: false
  console_level: INFO
  file_enabled: true
  file_path: logs/clipai.log
  file_level: DEBUG
  module_levels:
    clipai.hotkey: INFO
    clipai.input: INFO
    clipai.output: INFO
    clipai.action_runner: INFO
  diagnostics:
    hotkey_raw_events: false
    selection_capture_polls: false
    paste_timing: false
