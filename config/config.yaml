schema_version: 2

app:
  stream: true
  temperature: 0.2
  modifier_mode: ctrl_alt
  entry_panel_enabled: true

provider:
  active: gemini
  gemini:
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-3.5-flash-lite
    available_models:
      - gemini-3.5-flash-lite
      - gemini-3.1-flash-lite
      - gemini-2.5-flash
    timeout_sec: 60
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com
    model: gpt-4.1-mini
    available_models:
      - gpt-4.1-mini
      - gpt-4.1
    timeout_sec: 60
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    available_models:
      - claude-sonnet-4-5
      - claude-haiku-4-5
    timeout_sec: 60
    api_version: "2023-06-01"
    max_tokens: 1024
  gateway:
    name: Custom Gateway
    base_url: ""
    model: ""
    timeout_sec: 60

runtime:
  maintenance_workers: 1

tts:
  enabled: true
  voice: zh-TW-HsiaoChenNeural
  english_voice: en-US-AndrewNeural
  japanese_voice: ja-JP-NanamiNeural
  rate: "+0%"
  volume: "+0%"

voice_input:
  # Voice Input V1 always uses the controlled Edge WebView2 Browser Speech host.
  backend: edge_webview2_browser_speech

logging:
  enabled: true
  level: INFO
  console: false
  console_level: INFO
  file_enabled: true
  file_path: logs/clipai.log
  file_level: DEBUG
  module_levels:
    clipai.hotkey: INFO
    clipai.input: INFO
    clipai.output: INFO
    clipai.action_runner: INFO
  diagnostics:
    hotkey_raw_events: true
    selection_capture_polls: false
    paste_timing: false
    focus_transitions: true
