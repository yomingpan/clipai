schema_version: 1

app:
  stream: false
  temperature: 0.2
  modifier_mode: ctrl_alt
  system_prompt: |
    你是 ClipAI。
    你的目標是降低使用者的認知負荷，讓人用最短時間看懂重點。

    共通原則：
    - 先給結論，再給必要資訊。
    - 預設以人能在 1-2 秒內掃讀完為目標：先用一句話回答，再以最多 3 個短 bullet 補足；能用一句話說清楚時，不要列點。
    - 預設總長不超過 5 行、約 120 個中文字；只有使用者明確要求深入內容，或 Action 要求保留、翻譯、改寫完整內容時才可超出。
    - 複雜概念先說「它是什麼／為什麼重要」，再說最關鍵的下一步或差異；不要先鋪陳定義、背景、例外或推理過程。
    - 一段只表達一個意思。
    - 避免長句、避免抽象空話、避免重複說明。
    - 只有在真的必要時才補充背景。
    - 不要主動附加例子、延伸建議、注意事項、替代方案或結語；除非它們是回答問題不可缺少的資訊。
    - Action 明確指定的輸出形式優先；翻譯、改寫或對話式說明應直接輸出自然文字，不要強行加入標題或列點。

    如果輸出會顯示在 popup：
    - 只有內容本身需要結構時，才使用適合小視窗快速掃讀的 Markdown。
    - 整份內容最多 4 個核心區塊；需要更少區塊時不要為湊格式增加低資訊標題。
    - 每個區塊最多 2-4 個 bullet。
    - 每個 bullet 盡量短，讓使用者 1-2 秒內能掃懂。
    - heading 必須短，不可使用低資訊密度標題。
    - 禁止巢狀列點、長段落、表格、blockquote、code fence，除非使用者明確要求。
    - 空白行最多一行，不可用大段空白做分隔。
    - 不要使用「一句話」「支撐要點」這類冗詞標題。
    - 不要先總結一次，再用另一種說法重講一次。

provider:
  active: gemini
  gemini:
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-3.1-flash-lite
    available_models:
      - gemini-3.1-flash-lite
      - gemini-2.5-flash
    timeout_sec: 60
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com
    model: gpt-4.1-mini
    available_models:
      - gpt-4.1-mini
      - gpt-4.1
    timeout_sec: 60
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    available_models:
      - claude-sonnet-4-5
      - claude-haiku-4-5
    timeout_sec: 60
    api_version: "2023-06-01"
    max_tokens: 1024
  gateway:
    name: Custom Gateway
    base_url: ""
    model: ""
    timeout_sec: 60

runtime:
  max_workers: 2

tts:
  enabled: true
  voice: zh-TW-HsiaoChenNeural
  english_voice: en-US-AndrewNeural
  rate: "+0%"
  volume: "+0%"

voice_input:
  # browser_speech opens Chrome/Edge and uses the browser Web Speech API.
  # webview/openai keeps the earlier pywebview path available as a fallback.
  backend: browser_speech
  browser: edge
  host: 127.0.0.1
  port: 8765
  allow_port_fallback: true
  language: zh-TW
  auto_start: false
  clipboard_mode: replace_full_text
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: whisper-1
    language: zh
    timeout_sec: 60

logging:
  enabled: true
  level: INFO
  console: false
  console_level: INFO
  file_enabled: true
  file_path: logs/clipai.log
  file_level: DEBUG
  module_levels:
    clipai.hotkey: INFO
    clipai.input: INFO
    clipai.output: INFO
    clipai.action_runner: INFO
  diagnostics:
    hotkey_raw_events: false
    selection_capture_polls: false
    paste_timing: false
