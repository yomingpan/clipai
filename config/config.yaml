schema_version: 1

app:
  stream: false
  temperature: 0.2
  modifier_mode: ctrl_alt
  system_prompt: |
    你是 ClipAI，幫使用者快速處理眼前內容。

    回答原則：
    - 先直接回答，用清楚自然的語氣。
    - 讓人能在 1–2 秒看懂。預設不超過 5 行或 120 字；只有需要時才多寫。
    - 不主動加例子、延伸話題或重複說明。
    - 不確定就直接說明，不要猜測或編造資料。
    - 保留輸入原本的語言、格式和意思；不要自行翻譯或改變內容。
    - 依 Action 的要求回應；不要加入沒有被要求的內容。

    Popup 格式：
    - 使用簡單 Markdown，最多四個重點區塊。
    - 每個區塊以 2–4 個短 bullet 呈現；每個 bullet 最多 1–2 句。
    - 標題要短、有意義，不要用空泛標題。
    - 不用巢狀清單、引用區塊或程式碼區塊來塞內容。
    - 沒有足夠資訊時，直接說明限制，不要補出看似合理的內容。

provider:
  active: gemini
  gemini:
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com
    model: gemini-3.1-flash-lite
    available_models:
      - gemini-3.1-flash-lite
      - gemini-2.5-flash
    timeout_sec: 60
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com
    model: gpt-4.1-mini
    available_models:
      - gpt-4.1-mini
      - gpt-4.1
    timeout_sec: 60
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    model: claude-sonnet-4-5
    available_models:
      - claude-sonnet-4-5
      - claude-haiku-4-5
    timeout_sec: 60
    api_version: "2023-06-01"
    max_tokens: 1024
  gateway:
    name: Custom Gateway
    base_url: ""
    model: ""
    timeout_sec: 60

runtime:
  max_workers: 2

tts:
  enabled: true
  voice: zh-TW-HsiaoChenNeural
  english_voice: en-US-AndrewNeural
  rate: "+0%"
  volume: "+0%"

voice_input:
  # browser_speech opens Chrome/Edge and uses the browser Web Speech API.
  # webview/openai keeps the earlier pywebview path available as a fallback.
  backend: browser_speech
  browser: edge
  host: 127.0.0.1
  port: 8765
  allow_port_fallback: true
  language: zh-TW
  auto_start: false
  clipboard_mode: replace_full_text
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model: whisper-1
    language: zh
    timeout_sec: 60

logging:
  enabled: true
  level: INFO
  console: false
  console_level: INFO
  file_enabled: true
  file_path: logs/clipai.log
  file_level: DEBUG
  module_levels:
    clipai.hotkey: INFO
    clipai.input: INFO
    clipai.output: INFO
    clipai.action_runner: INFO
  diagnostics:
    hotkey_raw_events: false
    selection_capture_polls: false
    paste_timing: false
