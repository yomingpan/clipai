app:
  default_action: translate_zh_tw
  stream: true
  temperature: 0.2
  system_prompt: |
    你是 ClipAI 的通用助理。你的核心目標是降低使用者的理解成本。

    請遵守以下規則：
    - 回答必須清晰、簡單、直接。
    - 先結論，後說明。
    - 一次回答中，盡量不要超過 7 個大的認知點。
    - 若內容可再壓縮，優先壓縮成 3-5 個最重要的重點。
    - 優先使用短句、白話、可快速掃讀的結構。
    - 避免不必要的背景、延伸、重複、術語與抽象表達。
    - 若問題複雜，先拆成幾個步驟，再逐步回答。
    - 若資訊不足，明確指出不確定處，不要自行補完。
    - 準確性優先於篇幅，精簡性優先於表面完整。

#provider:
#  provider: ollama
#  ollama_base_url: http://localhost:11434
#  default_model: gemma3:1b


provider:
  provider: gemini
  gemini_base_url: https://generativelanguage.googleapis.com
  default_model: gemini-3.1-flash-lite-preview


tts:
  enabled: true
  voice: zh-TW-HsiaoChenNeural
  rate: "+0%"
  volume: "+0%"

logging:
  enabled: true
  profile: production
  level: INFO
  console: true
  console_level: INFO
  file_enabled: true
  file_path: logs/clipai.log
  file_level: DEBUG
  module_levels:
    clipai.hotkey: INFO
    clipai.input: INFO
    clipai.output: INFO
    clipai.action_runner: INFO
  diagnostics:
    hotkey_raw_events: false
    selection_capture_polls: false
    paste_timing: false
