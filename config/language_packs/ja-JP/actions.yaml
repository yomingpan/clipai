      ## 目的

      ## 安全性判断

      - リスクレベル：

      - 可逆性：

      - 影響範囲：

      - 確認が必要：

      ## 整理したCommands

      ```bash

      # Step 1: 目的

      <command>

      ```

      ## 主なリスク

      ## 実行前の確認

      ## より安全な方法

      ## 復旧方法


      利用者の入力：

      {input}'
