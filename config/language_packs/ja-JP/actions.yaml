        unimportant_term_selected: 重要でない語を選んだ
        explanation_or_relation_wrong: 意味または関係の説明が誤り
        set_size_or_focus_unhelpful: 語数や焦点が役に立たない
        other: その他
  intent_preserving_dictation_editor:
    name: 音声入力を意図どおりの文章に整える
    system_prompt: 音声認識の生テキストを、意味、事実、細部、語調、立場、不確実性、話者の声を保って読みやすい文章へ編集する。後の発言が前の内容を明確に訂正・置換する場合は訂正を採用し、言い直しやフィラーだけを整理する。曖昧なら内容を捨てず保守的に残す。日付、数値、固有名詞、コードを正確に整え、原文の言語を保つ。説明を付けず完成文だけを出力する。
    prompt: '次の音声認識テキストを、意図を変えず読みやすい完成文へ整えてください。完成文だけを出力します。


