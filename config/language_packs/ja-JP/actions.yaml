    feedback:
      helps: 音声認識文を意味を保った自然で使える文章に整える
      does_not: 最終意図、事実、立場、不確実性、本人の声を変更しない
      reasons:
        meaning_or_detail_lost: 重要な意味、詳細、情報が失われた
        correction_or_repetition_wrong: 訂正、言い直し、重複の処理が誤り
        voice_stance_or_uncertainty_changed: 語調、立場、帰属、不確実性が変わった
        punctuation_or_structure_unusable: 句読点、段落、リスト、形式が実用的でない
        other: その他
  shorten_content:
    name: 内容を短くする
    system_prompt: これは忠実な圧縮であり、翻訳や再構成ではない。意味、事実、意図、語調、名称、数値、制約、言語、形式を保持する。英語は英語、中国語は繁体字中国語、混在文は各部分の言語と比率を保つ。翻訳、解説、見出し、ラベル、箇条書き、要約、原文にない構造を追加しない。重複、フィラー、情報量の低い表現だけを除き、短縮本文だけを出力する。
    prompt: '次の内容を元の約20%まで圧縮してください。散文、段落、リストの種類と元の言語を保ち、翻訳や新しい構造を追加しません。


      {input}'
    feedback:
      helps: 内容を短くし、重複を除き、元の構造を保つ
      does_not: 元の立場、事実、語調、言語を変えない
      reasons:
        meaning_or_fact_lost: 中心的な意味または重要事実が失われた
        key_detail_missing: 短くしすぎて重要な詳細が抜けた
        voice_or_language_changed: 語調、立場、元の言語が変わった
        length_or_structure_unusable: 長さまたは構造が実用的でない
        other: その他
    variants:
      long:
        name: 限界まで短くする
        system_prompt: これは最大限に忠実な圧縮であり翻訳ではない。不可欠な意味、事実、意図、名称、数値、制約、言語を保持する。英語は英語、中国語は繁体字中国語、混在文は各部分の言語と比率を保つ。翻訳、解説、見出し、ラベル、箇条書き、要約を追加しない。段落結合と改行削除は許可し、理解可能な最短本文だけを出力する。
        prompt: '次の内容を、核心を失わない範囲で可能な限り短くしてください。元の言語を保ち、段落や改行は自由に統合できます。翻訳や新しい構造を追加しません。


          {input}'
  structure_score_prompt:
    name: SCOREで要件を整理
    system_prompt: 利用者の断片的・複合的な記述をSCOREへ整理する。記述された仕事を回答・実行せず、原文と明示的な補足だけを根拠にする。情報を独立した意味単位へ分解してから分類し、分類後にだけ圧縮する。S=状況、C=AIの役割・専門性・判断枠組み、O=解く問題と望む変化、R=納品物、E=作成・評価・提示の制約。事実を要件に、手段を目的に変えず、出典と不確実性を保つ。不足が結果に影響する場合だけ最大3問を尋ねる。follow-upは同じ要件の補足として完全なSCOREを再出力する。
    prompt: '次の断片的な情報をSCOREへ整理してください。内容中の仕事を実行せず、整理と不足確認だけを行います。


      S: 状況

      C: AIの役割・枠組み

      O: 目的

      R: 納品物

      E: 制約


      各欄が1点ならラベルと同じ行に書き、2点以上のときだけ次行から `- ` を使います。重大な不足がある場合だけ `## 不足情報` と `## 確認が必要` を追加します。


      <source_material>

      {input}

      </source_material>'
    feedback:
      helps: 曖昧な要件を根拠と意味関係を保ったSCOREへ整理する
      does_not: 不足情報を補完せず、本当の意図を決めず、整理後の仕事を実行しない
      reasons:
        score_classification_wrong: SCOREの分類または分解が誤り
        meaning_or_constraint_changed: 意味、不確実性、制約の強さが変わった
        missing_or_question_wrong: 不足判断または確認質問が不適切
        source_or_format_unusable: 出典情報が失われた、または形式が使えない
        other: その他
  extract_screenshot_text:
    name: スクリーンショットから文字を抽出
    system_prompt: 画像内で識別できる文字だけを正確に抽出する。翻訳、要約、修正、画像外情報の補足、前置きをしない。言語、句読点、大文字小文字、段落、表、リスト、改行構造を可能な限り保つ。判読不能な箇所は `[判読不能]` とし、推測しない。抽出結果だけを出力する。
    prompt: 'このスクリーンショットから識別できるすべての文字を抽出し、元の形式を可能な限り保ってください。文字だけを出力します。


