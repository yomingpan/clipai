schema_version: 2

categories:
  - id: understand
    slot: 3
    label: 看得懂
    description: 降低理解門檻，掌握這段內容真正要表達的意思。
    flagship:
      - action_id: translate_to_traditional_chinese
        press_type: short
      - action_id: english_companion
        press_type: short
      - action_id: explain_like_friend
        press_type: short
      - action_id: reading_friction
        press_type: short
    advanced:
      - action_id: article_structure
        press_type: short
      - action_id: extract_keywords
        press_type: short

  - id: write
    slot: 4
    label: 寫得出
    description: 把已有的意思轉成可直接使用的文字。
    flagship:
      - action_id: translate_to_english
        press_type: short
      - action_id: shorten_content
        press_type: short
      - action_id: personal_style_informal
        press_type: short
      - action_id: intent_preserving_dictation_editor
        press_type: short
    advanced:
      - action_id: expression_retrieval
        press_type: short
      - action_id: personal_style_oral
        press_type: short
      - action_id: personal_style_presentation
        press_type: short

  - id: think
    slot: 5
    label: 想清楚
    description: 照亮結構、盲點與取捨，保留最後判斷給你。
    flagship:
      - action_id: pyramid_position
        press_type: short
      - action_id: critical_thinking
        press_type: short
      - action_id: tradeoff_perspective
        press_type: short
      - action_id: reflective_question
        press_type: short
    advanced:
      - action_id: name_idea
        press_type: short
      - action_id: name_concept_carefully
        press_type: short
      - action_id: illuminate_essence
        press_type: short
      - action_id: temporary_viewpoint
        press_type: short
      - action_id: mece_decomposition
        press_type: short
      - action_id: minimum_action
        press_type: short
      - action_id: structure_score_prompt
        press_type: short

  - id: tools
    slot: 6
    label: 工具
    description: 把內容或脈絡帶進來，再交給既有 Action 處理。
    flagship:
      - action_id: extract_screenshot_text
        press_type: short
      - action_id: session_handoff
        press_type: short
      - action_id: command_copilot
        press_type: short
    advanced: []
