[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipai"
version = "3.0.1"
description = "Event-driven ClipAI architecture"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PyYAML",
  "requests",
  "pyperclip",
  "pynput",
  "python-dotenv",
  "plyer",
  "pystray",
  "Pillow",
  "customtkinter",
  "edge-tts",
  "miniaudio",
  "pygame-ce",
  "langdetect",
  "certifi",
  "pip-system-certs>=5; sys_platform == 'win32'",
  "Markdown",
  "pywebview",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.10",
]

[project.gui-scripts]
clipai = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ClipAI*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: touches real OS, UI, keyboard, clipboard, provider, or network-like surfaces",
  "slow: expensive test that should be run intentionally",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
