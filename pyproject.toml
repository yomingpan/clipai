[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipai-v2"
version = "0.1.0"
description = "Event-driven ClipAI architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "requests",
  "pyperclip",
  "pyinput",
  "python-dotenv",
  "plyer",
  "pystray",
  "Pillow",
  "h-tts",
  "miniaudio",
  "pygame-ce",
  "langdetect",
  "certifi",
  "aiohttp",
  "certifi-win32",
  "Markdown",
  "pywebview",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
