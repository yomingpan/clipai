name: Windows CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  constrained:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints/windows.txt -e ".[dev]"
      - run: python -m compileall ClipAI scripts tests
      - run: python scripts/run_unit_tests.py
      - run: python scripts/run_unit_tests.py -- tests/architecture

  unconstrained-dependencies:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_unit_tests.py
