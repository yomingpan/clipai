name: Temporary shortcut diagnosis
on:
  push:
    branches: ['release-validation/3.7.18']
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -c constraints/windows.txt
      - run: python -m pytest tests/platform/test_installation_windows.py -m integration -q
