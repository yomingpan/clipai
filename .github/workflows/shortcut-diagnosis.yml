name: Temporary shortcut diagnosis
on:
  push:
    branches: ['release-validation/3.7.18']
permissions:
  contents: read
jobs:
  shortcut:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, no-autoload]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe existing shortcut adapter on a fresh runner
        run: python -I experiments/first_install/probe_shortcut_runner.py --mode ${{ matrix.mode }}
