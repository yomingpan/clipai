name: Build verified release candidates

on:
  push:
    branches:
      - "release-validation/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install --upgrade pip build tomli pip-tools -c constraints/windows.txt cryptography

      - name: Verify repository and candidate identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne "yomingpan/clipai") {
            throw "Managed releases may only be published from yomingpan/clipai"
          }
          $version = python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag must be $tag" }
          if ($env:GITHUB_REF_TYPE -ne "tag" -and -not $env:GITHUB_REF_NAME.StartsWith("release-validation/")) {
            throw "Only an isolated validation branch or matching tag is admitted"
          }
          "CLIPAI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CLIPAI_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build wheel and source distribution
        run: python -m build

      - name: Compile hashed Python 3.12 Windows dependency lock
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python -m piptools compile --generate-hashes --strip-extras --no-emit-index-url --constraint constraints\windows.txt --output-file release\dependencies.lock pyproject.toml
          $wheel = (Get-ChildItem dist\clipai-*.whl -File -ErrorAction Stop)
          if ($wheel.Count -ne 1) { throw "Exactly one ClipAI wheel is required" }
          python -m scripts.build_managed_release --prepare-lock `
            --dependency-lock release\dependencies.lock `
            --clipai-wheel $wheel.FullName `
            --requirements-lock release\build-requirements.lock `
            --app-version $env:CLIPAI_VERSION

      - name: Build complete offline wheelhouse
        run: >-
          python -m pip wheel
          --require-hashes
          --find-links dist
          --wheel-dir release\wheelhouse
          -r release\build-requirements.lock

      - name: Seal the exact offline wheel bytes
        run: >-
          python -m scripts.build_managed_release --seal-wheelhouse-lock
          --dependency-lock release/dependencies.lock
          --wheelhouse release/wheelhouse
          --requirements-lock release/requirements.lock
          --app-version ${{ env.CLIPAI_VERSION }}

      - name: Assemble immutable managed payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release\payload -Force | Out-Null
          Copy-Item -LiteralPath main.py -Destination release\payload\main.py
          Copy-Item -LiteralPath config -Destination release\payload\config -Recurse

      - name: Prepare ephemeral validation authority
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          $privateKey = Join-Path $env:RUNNER_TEMP "clipai-managed-update-signing-key"
          python -c "import os, subprocess; subprocess.run(['ssh-keygen.exe', '-q', '-t', 'ed25519', '-N', '', '-f', os.path.join(os.environ['RUNNER_TEMP'], 'clipai-managed-update-signing-key')], check=True)"
          if ($LASTEXITCODE -ne 0) { throw "Could not generate validation authority" }
          $keyId = "local-validation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $publicKey = (Get-Content -LiteralPath "$privateKey.pub" -Raw).Trim()
          $keyring = @{schema_version=1; keyring_kind="clipai-managed-update-trusted-keys-v1"; keys=@(
            @{key_id=$keyId; algorithm="ssh-ed25519"; public_key=$publicKey; key_kind="production"}
          )} | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP "clipai-managed-update-trusted-keys.json"), $keyring, [Text.UTF8Encoding]::new($false))
          "CLIPAI_VALIDATION_KEY_ID=$keyId" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Admit official tag authority
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          CLIPAI_MANAGED_UPDATE_PRIVATE_KEY: ${{ secrets.CLIPAI_MANAGED_UPDATE_PRIVATE_KEY }}
          CLIPAI_MANAGED_UPDATE_KEY_ID: ${{ vars.CLIPAI_MANAGED_UPDATE_KEY_ID }}
          CLIPAI_MANAGED_UPDATE_TRUSTED_KEYRING: ${{ vars.CLIPAI_MANAGED_UPDATE_TRUSTED_KEYRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIPAI_MANAGED_UPDATE_PRIVATE_KEY)) { throw "Missing managed update private key" }
          if ([string]::IsNullOrWhiteSpace($env:CLIPAI_MANAGED_UPDATE_KEY_ID)) { throw "Missing managed update key id" }
          if ([string]::IsNullOrWhiteSpace($env:CLIPAI_MANAGED_UPDATE_TRUSTED_KEYRING)) { throw "Missing managed update trusted keyring" }
          $privateKey = Join-Path $env:RUNNER_TEMP "clipai-managed-update-signing-key"
          $trustedKeyring = Join-Path $env:RUNNER_TEMP "clipai-managed-update-trusted-keys.json"
          $privateKeyContent = $env:CLIPAI_MANAGED_UPDATE_PRIVATE_KEY -replace "`r`n", "`n" -replace "`r", "`n"
          [IO.File]::WriteAllText($privateKey, $privateKeyContent.TrimEnd("`r", "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $privateKeyIdentity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls.exe $privateKey /inheritance:r /grant:r "${privateKeyIdentity}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict managed update private key permissions" }
          & ssh-keygen.exe -y -f $privateKey | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Managed update private key is invalid" }
          [IO.File]::WriteAllText($trustedKeyring, $env:CLIPAI_MANAGED_UPDATE_TRUSTED_KEYRING + "`n", [Text.UTF8Encoding]::new($false))
      - name: Build signed managed bundle and publication metadata
        shell: pwsh
        env:
          CLIPAI_OFFICIAL_KEY_ID: ${{ github.ref_type == 'tag' && vars.CLIPAI_MANAGED_UPDATE_KEY_ID || '' }}
        run: |
          $privateKey = Join-Path $env:RUNNER_TEMP "clipai-managed-update-signing-key"
          $trustedKeyring = Join-Path $env:RUNNER_TEMP "clipai-managed-update-trusted-keys.json"
          $keyId = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:CLIPAI_OFFICIAL_KEY_ID } else { $env:CLIPAI_VALIDATION_KEY_ID }
          if ([string]::IsNullOrWhiteSpace($keyId)) { throw "Missing admitted authority" }
          New-Item -ItemType Directory -Path release\assets, release\work -Force | Out-Null
          $version = $env:CLIPAI_VERSION
          $tag = $env:CLIPAI_TAG
          $bundle = "release\assets\clipai-managed-$version.zip"
          $bundleUrl = "https://github.com/yomingpan/clipai/releases/download/$tag/clipai-managed-$version.zip"
          python -m scripts.build_managed_release `
            --payload-root release\payload `
            --wheelhouse release\wheelhouse `
            --requirements-lock release\requirements.lock `
            --output $bundle `
            --app-version $version `
            --key-id $keyId `
            --private-key $privateKey `
            --work-root release\work `
            --catalog-output release\assets\catalog.json `
            --bundle-url $bundleUrl `
            --minimum-launcher-version 3.7.18 `
            --trusted-keyring $trustedKeyring `
            --trusted-keyring-output release\assets\managed-update-trusted-keys.json

      - name: Install test dependencies
        run: python -m pip install -c constraints\windows.txt -e ".[dev]"

      - name: Verify complete managed update transaction
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          python scripts\verify_managed_update.py --stage managed-bundle --python $python

      - name: Fetch pinned Setup inputs and compiler
        run: python -m scripts.fetch_setup_inputs --inputs packaging/windows/setup-inputs.json --output release/bootstrap --install-compiler

      - name: Package the same managed bundle into isolated technical Setup
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          python -m scripts.build_setup_release `
            --bundle "release/assets/clipai-managed-$env:CLIPAI_VERSION.zip" `
            --catalog release/assets/catalog.json `
            --keyring release/assets/managed-update-trusted-keys.json `
            --inputs packaging/windows/setup-inputs.json `
            --runtime-archive release/bootstrap/runtime.archive `
            --compiler release/bootstrap/compiler/ISCC.exe `
            --output-root release/setup `
            --tag $env:CLIPAI_TAG --source-commit $commit --technical-candidate

      - name: Prove installed-wheel imports and compiled Setup payload
        shell: pwsh
        run: |
          python -m scripts.verify_packaged_app --stage release/setup/stage --output release/setup/output/packaged-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged app smoke failed" }
          python -m scripts.verify_setup_extraction --assets release/setup/output
          if ($LASTEXITCODE -ne 0) { throw "Compiled Setup extraction failed" }
          python -m scripts.verify_release_assets --assets release/setup/output
          if ($LASTEXITCODE -ne 0) { throw "Candidate asset validation failed" }

      - name: Upload auditable workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipai-${{ env.CLIPAI_TAG }}-${{ github.run_id }}
          path: |
            dist/*
            release/setup/output/**
            release/requirements.lock
            release/dependencies.lock
            release/build-requirements.lock

      # Publication is intentionally outside this candidate workflow. See the
      # exact-hash acceptance + Authenticode gate in docs/RELEASE_CHECKLIST.md.

      - name: Remove private signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "clipai-managed-update-signing-key") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "clipai-managed-update-signing-key.pub") -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "clipai-managed-update-trusted-keys.json") -Force -ErrorAction SilentlyContinue
