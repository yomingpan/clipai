<!doctype html>
<meta charset="utf-8">
<title>ClipAI Voice Engine</title>
<script>
(() => {
  let capture = null;
  const emit = payload => window.pywebview.api.emit(payload);
  const stopTracks = stream => { if (stream) stream.getTracks().forEach(track => track.stop()); };
  const stopMeter = item => {
    if (item.meterTimer) clearInterval(item.meterTimer);
    item.meterTimer = null;
    if (item.audioSource) item.audioSource.disconnect();
    item.audioSource = null;
    if (item.audioContext) item.audioContext.close();
    item.audioContext = null;
  };
  const startMeter = item => {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const context = item.audioContext = new AudioContext();
    const analyser = item.analyser = context.createAnalyser();
    analyser.fftSize = 256;
    item.audioSource = context.createMediaStreamSource(item.stream);
    item.audioSource.connect(analyser);
    const samples = new Uint8Array(analyser.fftSize);
    item.meterTimer = setInterval(() => {
      if (item.finished) return;
      analyser.getByteTimeDomainData(samples);
      let energy = 0;
      for (const sample of samples) {
        const normalized = (sample - 128) / 128;
        energy += normalized * normalized;
      }
      const level = Math.min(1, Math.sqrt(energy / samples.length) * 4);
      emit({kind: "audio_level", capture_id: item.id, level});
    }, 100);
  };
  const microphoneFailure = error => {
    const name = error && error.name;
    if (name === "NotAllowedError" || name === "SecurityError") {
      return {failure: "permission_denied", detail: "Microphone permission was denied."};
    }
    if (name === "NotFoundError" || name === "DevicesNotFoundError" || name === "OverconstrainedError") {
      return {failure: "unavailable", detail: "No microphone was detected. Connect one and try again."};
    }
    return {failure: "initialization_failed", detail: "Voice Input could not start. Check your microphone and try again."};
  };
  const finish = async (item, failure = "", detail = "") => {
    if (!item || item.finished) return;
    item.finished = true;
    stopMeter(item);
    stopTracks(item.stream);
    window.pywebview.api.hide();
    if (failure) emit({kind: "failed", capture_id: item.id, failure, ...(detail ? {detail} : {})});
    emit({kind: "ended", capture_id: item.id});
    if (capture === item) capture = null;
  };
  const prepare = async command => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      stopTracks(stream);
      emit({kind: "setup_ready", setup_id: command.setup_id});
      window.pywebview.api.hide();
    } catch (error) {
      if (error && error.name === "NotAllowedError") emit({kind: "setup_blocked", setup_id: command.setup_id});
      else {
        const failure = microphoneFailure(error);
        emit({kind: "setup_failed", setup_id: command.setup_id, ...failure});
      }
    }
  };
  const start = async command => {
    if (capture) return;
    const item = {id: command.capture_id, stream: null, recognition: null, stopped: false, finished: false, sequence: command.sequence_start || 0, audioContext: null, audioSource: null, analyser: null, meterTimer: null};
    capture = item;
    try {
      item.stream = await navigator.mediaDevices.getUserMedia({audio: true});
      if (item.stopped) return finish(item);
      startMeter(item);
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) return finish(item, "unavailable");
      const recognition = item.recognition = new Recognition();
      recognition.lang = command.language;
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.onstart = () => {
        if (item.stopped) return;
        emit({kind: "listening", capture_id: item.id});
        window.pywebview.api.hide();
      };
      recognition.onresult = event => {
        let interim = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const text = event.results[index][0].transcript || "";
          if (event.results[index].isFinal) emit({kind: "final", capture_id: item.id, sequence: item.sequence++, text});
          else interim += text;
        }
        if (interim) emit({kind: "interim", capture_id: item.id, text: interim});
      };
      recognition.onerror = event => {
        if (item.stopped) return;
        if (event.error === "not-allowed") return finish(item, "permission_denied", "Microphone permission was denied.");
        if (event.error === "audio-capture") return finish(item, "unavailable", "No microphone was detected. Connect one and try again.");
        finish(item, "initialization_failed", "Voice Input could not start. Check your microphone and try again.");
      };
      recognition.onend = () => finish(item);
      recognition.start();
    } catch (error) {
      const failure = microphoneFailure(error);
      finish(item, failure.failure, failure.detail);
    }
  };
  window.addEventListener("pywebviewready", () => {
    window.clipaiVoice = {
      command(command) {
        if (command.command === "prepare") prepare(command);
        else if (command.command === "start") start(command);
        else if (capture && capture.id === command.capture_id) {
          capture.stopped = true;
          try { command.command === "cancel" ? capture.recognition.abort() : capture.recognition.stop(); }
          catch (_) { finish(capture); }
        }
      },
      shutdown() { if (capture) { capture.stopped = true; try { capture.recognition.abort(); } catch (_) { finish(capture); } } }
    };
    emit({kind: "bridge_ready"});
  }, {once: true});
})();
</script>
